server.port=8080
server.address=0.0.0.0

spring.application.name=demo

# PostgreSQL for production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chessmate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chessmate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chessmate}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Connection pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

app.secret-key=536756685970373367639792f243f4528482b4d625156468576d5a71347437
app.expiration-time=1500000

# Autoriser l'upload de fichiers jusqu'à 100 Mo
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.chessmate=DEBUG
